<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют ПМР</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="converter-card">
        <h2>Конвертер валют</h2>
        
        <div class="input-group">
            <label for="amount">Сумма:</label>
            <input type="number" id="amount" value="1" min="0">
        </div>

        <div class="currencies-row">
            <div class="input-group">
                <label for="fromCurrency">Из:</label>
                <select id="fromCurrency">
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="RUB">RUB (₽)</option>
                    <option value="RUP" selected>РУБ ПМР (р.)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="toCurrency">В:</label>
                <select id="toCurrency">
                    <option value="USD" selected>USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="RUB">RUB (₽)</option>
                    <option value="RUP">РУБ ПМР (р.)</option>
                </select>
            </div>
        </div>

        <button id="convertBtn">Конвертировать</button>

        <div class="result" id="resultBlock">
            Результат появится здесь
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
